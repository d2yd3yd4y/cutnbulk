{% extends "base.html" %}
{% block title %}忘记密码 · cutnbulk{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <h1>重置密码</h1>
    <p class="muted">输入注册邮箱，我们会发送重置链接</p>
    {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
    {% if message %}<div class="form-success">{{ message }}</div>{% endif %}
    <form method="post" action="/forgot-password" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>
        邮箱
        <input type="email" name="email" value="{{ email }}" required autocomplete="email">
      </label>
      <button class="primary-btn large full-width" type="submit">发送重置邮件</button>
    </form>
    <div class="auth-links">
      <a href="/login">返回登录</a>
    </div>
  </div>
</section>
{% endblock %}
