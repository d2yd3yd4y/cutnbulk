{% extends "base.html" %}
{% block title %}验证中 · cutnbulk{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <h1>正在验证</h1>
    <p class="muted">{{ message or "请稍候…" }}</p>
    <form method="post" action="/auth/session-from-tokens" id="token-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_path }}">
      <input type="hidden" name="access_token" id="access_token" value="">
      <input type="hidden" name="refresh_token" id="refresh_token" value="">
    </form>
    <p id="callback-status" class="muted">如果没有自动跳转，请返回登录页。</p>
    <div class="auth-links">
      <a href="/login">返回登录</a>
    </div>
  </div>
</section>
<script>
(function () {
  const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "";
  const params = new URLSearchParams(hash);
  const access = params.get("access_token") || "";
  const refresh = params.get("refresh_token") || "";
  if (!access) {
    document.getElementById("callback-status").textContent = "未检测到有效登录令牌，请重新登录。";
    return;
  }
  document.getElementById("access_token").value = access;
  document.getElementById("refresh_token").value = refresh;
  document.getElementById("token-form").submit();
})();
</script>
{% endblock %}
