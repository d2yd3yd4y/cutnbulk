{% extends "base.html" %}
{% block title %}设置新密码 · cutnbulk{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <h1>设置新密码</h1>
    <p class="muted">请输入新密码</p>
    {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
    {% if message %}<div class="form-success">{{ message }}</div>{% endif %}
    <form method="post" action="/auth/reset-password" class="auth-form" id="reset-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="access_token" id="access_token" value="">
      <input type="hidden" name="refresh_token" id="refresh_token" value="">
      <label>
        新密码
        <input type="password" name="password" required minlength="8" autocomplete="new-password">
      </label>
      <label>
        确认新密码
        <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
      </label>
      <button class="primary-btn large full-width" type="submit">保存新密码</button>
    </form>
    <div class="auth-links">
      <a href="/forgot-password">重新发送重置邮件</a>
    </div>
  </div>
</section>
<script>
(function () {
  const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "";
  const params = new URLSearchParams(hash);
  const access = params.get("access_token") || new URLSearchParams(window.location.search).get("access_token") || "";
  const refresh = params.get("refresh_token") || new URLSearchParams(window.location.search).get("refresh_token") || "";
  document.getElementById("access_token").value = access;
  document.getElementById("refresh_token").value = refresh;
})();
</script>
{% endblock %}
