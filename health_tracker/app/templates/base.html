<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}cutnbulk{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}?v=auth1">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-bar">
        <a class="app-brand" href="{% if current_user %}/{% else %}/login{% endif %}">
          <span class="logo-wrap">
            <img class="logo-img" src="{{ url_for('static', path='/images/logo.png') }}" alt="cutnbulk logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
            <span class="logo-fallback">C</span>
          </span>
          <span>cutnbulk</span>
        </a>
        {% if current_user %}
          <div class="app-bar-actions">
            <a class="app-bar-action" href="/today">
              {% if today is defined %}{{ today.strftime("%m.%d") }}{% else %}今日{% endif %}
            </a>
            <form class="logout-form" action="/logout" method="post">
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
              <button type="submit" class="text-link logout-btn">退出</button>
            </form>
          </div>
        {% else %}
          <a class="app-bar-action" href="/login">登录</a>
        {% endif %}
      </header>

      <main class="page">
        {% block content %}{% endblock %}
      </main>

      {% if current_user and not hide_nav %}
      <nav class="bottom-nav" aria-label="主导航">
        <a class="{% if active_page == 'calendar' %}active{% endif %}" href="/">
          <span>日历</span>
        </a>
        <a class="{% if active_page == 'today' %}active{% endif %}" href="/today">
          <span>今日</span>
        </a>
        <a class="{% if active_page == 'summary' %}active{% endif %}" href="/summary">
          <span>趋势</span>
        </a>
      </nav>
      {% endif %}
    </div>

    <script src="{{ url_for('static', path='/app.js') }}?v=auth1"></script>
  </body>
</html>
