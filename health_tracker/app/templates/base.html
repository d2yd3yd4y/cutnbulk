<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}cutnbulk{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">C</span>
        <span>
          <strong>cutnbulk</strong>
          <small>健身饮食日历</small>
        </span>
      </a>
      <nav class="nav">
        <a class="{% if active_page == 'calendar' %}active{% endif %}" href="/">日历</a>
        <a class="{% if active_page == 'today' %}active{% endif %}" href="/today">今日</a>
      </nav>
    </header>

    <main class="page">
      {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', path='/app.js') }}"></script>
  </body>
</html>
